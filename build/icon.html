<!doctype html>
<!-- مصدر الأيقونة. الهوية البصرية مؤجَّلة (§١٥) — فهذه علامة حرفية مؤقتة
     بلوحة التطبيق نفسها، تُستبدل بتبديل هذا الملف وحده. -->
<meta charset="utf-8">
<title>أيقونة كُنّاش</title>
<style>
  @font-face {
    font-family: 'Plex';
    src: url('../assets/fonts/IBMPlexSansArabic-SemiBold.ttf') format('truetype');
  }
  * { margin: 0; padding: 0; }
  html, body { width: 1024px; height: 1024px; background: transparent; }

  /* شبكة أيقونات الماك: مربع 824×824 داخل لوحة 1024، بهامش 100 */
  .icon {
    position: absolute; top: 100px; left: 100px;
    width: 824px; height: 824px;
    border-radius: 185px;
    background: #26241F;                     /* حبر */
    box-shadow: 0 18px 40px rgba(0,0,0,.28);
    overflow: hidden;
  }

  /* كعب الدفتر — شريطٌ على اليمين، فالكتاب العربي يُفتح من اليمين */
  .spine {
    position: absolute; top: 0; right: 0;
    width: 96px; height: 100%;
    background: #2F6F62;                     /* اللون المميّز */
  }
  .spine::after {                            /* خيط الحياكة */
    content: ''; position: absolute; top: 12%; right: 44px;
    width: 8px; height: 76%; border-radius: 4px;
    background: rgba(250, 248, 244, .30);
  }

  .glyph {
    position: absolute; inset: 0; right: 96px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Plex', sans-serif;
    font-size: 400px; line-height: 1;
    color: #FAF8F4;                          /* ورق */
    padding-bottom: 24px;                    /* موازنة بصرية: الكاف تجلس على السطر */
  }
</style>
<div class="icon">
  <div class="spine"></div>
  <div class="glyph">ك</div>
</div>
